name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve deployment URLs
        id: site
        env:
          SITE: ${{ vars.SITE }}
          BASE: ${{ vars.BASE }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node scripts/deploy-paths.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/contrast.mjs
      - run: npm test
      - run: npm run check
      - run: npx astro build
        env:
          SITE: ${{ vars.SITE || steps.site.outputs.site }}
          BASE: ${{ vars.BASE || steps.site.outputs.base }}
      # The CV PDF is rendered from the /about/ print view of the build, then a second build
      # copies public/cv/ into dist/.
      - run: npm run cv
      - run: npx astro build
        env:
          SITE: ${{ vars.SITE || steps.site.outputs.site }}
          BASE: ${{ vars.BASE || steps.site.outputs.base }}
      # The privacy gate scans the exact dist/ that the next step uploads.
      - run: npm run privacy
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
