name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve deployment URLs
        id: site
        env:
          SITE: ${{ vars.SITE }}
          BASE: ${{ vars.BASE }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node scripts/deploy-paths.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/contrast.mjs
      - run: npm test
      - run: npm run check
      - run: npx astro build
        env:
          SITE: ${{ vars.SITE || steps.site.outputs.site }}
          BASE: ${{ vars.BASE || steps.site.outputs.base }}
      # The CV PDF is rendered from the /about/ print view of the build, then a second build
      # copies public/cv/ into dist/.
      - run: npm run cv
      - run: npx astro build
        env:
          SITE: ${{ vars.SITE || steps.site.outputs.site }}
          BASE: ${{ vars.BASE || steps.site.outputs.base }}
      # The privacy gate scans the exact dist/ that the next step uploads.
      - run: npm run privacy
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
